# This compose file serves as documentation/reference.
# Actual deployment uses podman pod (see deploy.sh or .github/workflows/deploy.yml)
# Podman 3.4.4's compose support is too limited for reliable multi-container networking.
#
# Usage on VPS:
#   podman pod rm -f encounter-pod 2>/dev/null
#   podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000
#   podman run -d --pod encounter-pod --name encounter-daily-sql ...
#   podman run -d --pod encounter-pod --name encounter-daily-api ...
#   podman run -d --pod encounter-pod --name encounter-daily-nginx ...

version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: encounter-daily-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    volumes:
      - sql-data:/var/opt/mssql

  api:
    image: ghcr.io/jkanimea/encounter-daily-api:${API_IMAGE_TAG:-latest}
    container_name: encounter-daily-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=localhost,1433;Database=EncounterDaily;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - Jwt__RsaPrivateKey=${JWT_RSA_PRIVATE_KEY}
      - DevMode__BypassAuth=${BYPASS_AUTH:-false}
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:alpine
    container_name: encounter-daily-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

volumes:
  sql-data:

# Usage:
#   podman-compose up -d                    # Start stack
#   podman-compose -f podman-compose.prod.yml up -d  # Production
#
# First time: podman-compose run api --import-seed

version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: encounter-daily-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - encounter-daily-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-YourStrong@Passw0rd}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ../backend
      dockerfile: Containerfile
    image: ghcr.io/jkanimea/encounter-daily-api:${API_IMAGE_TAG:-latest}
    container_name: encounter-daily-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EncounterDaily;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - Jwt__RsaPrivateKey=${JWT_RSA_PRIVATE_KEY}
      - DevMode__BypassAuth=${BYPASS_AUTH:-false}
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - encounter-daily-net
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:alpine
    container_name: encounter-daily-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - encounter-daily-net
    restart: unless-stopped

  # Android APK builder (run on demand: podman-compose run android-builder)
  android-builder:
    build:
      context: ./android
      dockerfile: Containerfile
    container_name: encounter-daily-android-builder
    environment:
      - API_URL=https://mg-encounter.com/api/v1
    volumes:
      - ../frontend:/app/frontend:ro
      - android-output:/output
    networks:
      - encounter-daily-net

volumes:
  sql-data:
  android-output:

networks:
  encounter-daily-net:
    driver: bridge

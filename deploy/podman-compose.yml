# Usage:
#   podman-compose up -d                    # Start stack
#   podman-compose -f podman-compose.prod.yml up -d  # Production
#
# First time: podman-compose run api --import-seed

version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: encounter-daily-sql
    network_mode: host
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-YourStrong@Passw0rd}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ghcr.io/jkanimea/encounter-daily-api:${API_IMAGE_TAG:-latest}
    container_name: encounter-daily-api
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=localhost,1433;Database=EncounterDaily;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - Jwt__RsaPrivateKey=${JWT_RSA_PRIVATE_KEY}
      - DevMode__BypassAuth=${BYPASS_AUTH:-false}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:alpine
    container_name: encounter-daily-nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sql-data:

name: SSL Certificate Renewal

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Renew Let's Encrypt certificate on VPS
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -uo pipefail

            echo "== Deployed cert expiry before renewal =="
            sudo openssl x509 -enddate -noout -in /opt/encounter-daily/ssl/fullchain.pem 2>/dev/null || echo "(none)"

            echo "== Running certbot (HTTP-01 via webroot) =="
            sudo certbot certonly --webroot -w /opt/encounter-daily/frontend/www \
              --non-interactive --agree-tos \
              -d mg-encounter.com -d www.mg-encounter.com \
              --keep-until-expiring
            STATUS=$?
            echo "certbot exit code: $STATUS"
            [ "$STATUS" -eq 0 ] || { echo "ERROR: certbot failed"; exit 1; }

            echo "== Deploying certificate to nginx container =="
            NEW_SHA=$(sudo sha256sum /etc/letsencrypt/live/mg-encounter.com/fullchain.pem | awk '{print $1}')
            CUR_SHA=$(sha256sum /opt/encounter-daily/ssl/fullchain.pem 2>/dev/null | awk '{print $1}' || echo missing)
            echo "live=$NEW_SHA deployed=$CUR_SHA"
            if [ "$NEW_SHA" = "$CUR_SHA" ]; then
              echo "Certificate unchanged; no reload needed."
            else
              sudo cp /etc/letsencrypt/live/mg-encounter.com/fullchain.pem /opt/encounter-daily/ssl/fullchain.pem
              sudo cp /etc/letsencrypt/live/mg-encounter.com/privkey.pem /opt/encounter-daily/ssl/privkey.pem
              sudo chown jkanimea:jkanimea /opt/encounter-daily/ssl/fullchain.pem /opt/encounter-daily/ssl/privkey.pem
              if podman exec encounter-daily-nginx nginx -s reload 2>/dev/null; then
                echo "nginx reloaded in place."
              else
                echo "In-place reload failed; restarting nginx container..."
                podman restart encounter-daily-nginx
              fi
              sleep 2
            fi

            echo "== Certificate expiry after renewal =="
            sudo openssl x509 -enddate -noout -in /etc/letsencrypt/live/mg-encounter.com/fullchain.pem

            echo "== Verifying HTTPS =="
            curl -s -o /dev/null -w "https://mg-encounter.com -> HTTP %{http_code}\n" --max-time 15 https://mg-encounter.com/

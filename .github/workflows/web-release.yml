name: Web Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run unit tests
        run: dotnet test backend/ --filter "Category=Unit" --no-restore --verbosity normal

  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run integration tests
        run: dotnet test backend/ --filter "Category=Integration" --no-restore --verbosity normal

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run unit tests
        run: cd frontend && npx jest --ci --no-coverage --testPathPattern="src/app/core/"
      - name: Run linting
        run: cd frontend && npx ng lint

  frontend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run integration tests
        run: cd frontend && npx jest --ci --no-coverage --testPathPattern="src/app/features/"

  e2e-tests:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npm run e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-run${{ github.run_number }}
          path: frontend/playwright-report/

  build:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v6
        with: { node-version: 24.x }
      - name: Build .NET API
        run: dotnet publish backend/EncounterDaily.API/EncounterDaily.API.csproj -c Release -o publish/api
      - name: Build Angular app
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build -- --configuration production
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.ref_name }}-run${{ github.run_number }}
          path: |
            publish/
            frontend/www/

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output-${{ github.ref_name }}-run${{ github.run_number }}
          path: .

      - name: Copy seed data to build context
        run: cp -r database/seed-data backend/seed-data

      - name: Build and push API image
        run: |
          docker build -t ghcr.io/jkanimea/encounter-daily-api:production-latest -f backend/Containerfile backend
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jkanimea/encounter-daily-api:production-latest

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add VPS host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: could not scan host key"

      - name: Test SSH connectivity
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -vvv"
          echo "Testing SSH connectivity to ${{ vars.PRODUCTION_HOST }}:22 ..."
          echo "Loaded keys:"
          ssh-add -l
          timeout 35 ssh $SSH_OPTS ${{ vars.SSH_USER }}@${{ vars.PRODUCTION_HOST }} "echo 'SSH OK'" 2>&1 || {
            echo "ERROR: SSH connection failed. Check authorized_keys on VPS."
            exit 1
          }

      - name: Sync files to VPS
        run: |
          SSH_OPTS="-o ConnectTimeout=30"
          for attempt in 1 2 3; do
            echo "Attempt $attempt: syncing deploy files..."
            rsync -avz --timeout=300 -e "ssh $SSH_OPTS" \
              deploy/ ${{ vars.SSH_USER }}@${{ vars.PRODUCTION_HOST }}:/opt/encounter-daily/deploy/ && \
            echo "Attempt $attempt: syncing frontend..." && \
            rsync -avz --timeout=300 -e "ssh $SSH_OPTS" \
              frontend/www/ ${{ vars.SSH_USER }}@${{ vars.PRODUCTION_HOST }}:/opt/encounter-daily/frontend/www/ && \
            echo "Sync successful." && exit 0
            echo "Attempt $attempt failed. Retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed."
          exit 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.3
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          JWT_RSA_PRIVATE_KEY: ${{ secrets.JWT_RSA_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SA_PASSWORD, JWT_RSA_PRIVATE_KEY, GOOGLE_CLIENT_ID, FACEBOOK_APP_ID, FACEBOOK_APP_SECRET, DEEPSEEK_API_KEY
          script: |
            cd /opt/encounter-daily
            rm -rf android 2>/dev/null || true
            ROLLBACK_IMAGE=$(podman inspect --format '{{.Image}}' encounter-daily-api 2>/dev/null || echo "")
            cat > .env <<ENVEOF
            SA_PASSWORD="$SA_PASSWORD"
            JWT_RSA_PRIVATE_KEY="$JWT_RSA_PRIVATE_KEY"
            ASPNETCORE_ENVIRONMENT=Production
            BYPASS_AUTH=false
            JWT__GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
            OAUTH__GOOGLE__CLIENTID="$GOOGLE_CLIENT_ID"
            OAUTH__FACEBOOK__APPID="$FACEBOOK_APP_ID"
            OAUTH__FACEBOOK__APPSECRET="$FACEBOOK_APP_SECRET"
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
            API_IMAGE_TAG=production-latest
            ENVEOF
            chmod 600 .env
            sudo podman pod rm -f encounter-pod 2>/dev/null || true
            sleep 2
            podman pod rm -f encounter-pod 2>/dev/null || true
            podman pull ghcr.io/jkanimea/encounter-daily-api:production-latest
            set -a; source .env; set +a
            podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000 \
              || { echo "Pod create failed. Retrying after sudo cleanup...";
                   sudo podman pod rm -f encounter-pod 2>/dev/null || true;
                   sleep 2;
                   podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000 \
                     || { echo "FATAL: Could not create pod."; exit 1; }; }
            podman run -d --pod encounter-pod --name encounter-daily-sql \
              -e ACCEPT_EULA=Y \
              -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
              -e MSSQL_PID=Express \
              -v sql-data:/var/opt/mssql \
              mcr.microsoft.com/mssql/server:2022-latest
            echo "Waiting for SQL Server..."
            for i in $(seq 1 30); do
              podman exec encounter-daily-sql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
              sleep 2
            done
            podman run -d --pod encounter-pod --name encounter-daily-api \
              -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
              -e ASPNETCORE_URLS=http://+:5000 \
              -e ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=EncounterDaily;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;" \
              -e Jwt__RsaPrivateKey="$JWT_RSA_PRIVATE_KEY" \
              -e Jwt__GoogleClientId="$JWT__GOOGLE_CLIENT_ID" \
              -e DevMode__BypassAuth="$BYPASS_AUTH" \
              -e Ai__DeepSeekApiKey="$DEEPSEEK_API_KEY" \
              ghcr.io/jkanimea/encounter-daily-api:production-latest
            podman run -d --pod encounter-pod --name encounter-daily-nginx \
              -v /opt/encounter-daily/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /opt/encounter-daily/ssl:/etc/nginx/ssl:ro \
              -v /opt/encounter-daily/frontend/www:/opt/encounter-daily/frontend/www:ro \
              docker.io/nginx:alpine
            echo "Running smoke tests..."
            sleep 10
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/v1/health)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "SMOKE TEST FAILED: API returned HTTP $HTTP_CODE (expected 200)"
              if [ -n "$ROLLBACK_IMAGE" ]; then
                echo "Rolling back to $ROLLBACK_IMAGE..."
                podman pod rm -f encounter-pod 2>/dev/null || true
                sleep 2
                podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000
                podman run -d --pod encounter-pod --name encounter-daily-sql \
                  -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -e MSSQL_PID=Express \
                  -v sql-data:/var/opt/mssql mcr.microsoft.com/mssql/server:2022-latest
                for i in $(seq 1 30); do
                  podman exec encounter-daily-sql /opt/mssql-tools18/bin/sqlcmd \
                    -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
                  sleep 2
                done
                podman run -d --pod encounter-pod --name encounter-daily-api \
                  -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
                  -e ASPNETCORE_URLS=http://+:5000 \
                  -e ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=EncounterDaily;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;" \
                  -e Jwt__RsaPrivateKey="$JWT_RSA_PRIVATE_KEY" \
                  -e Jwt__GoogleClientId="$JWT__GOOGLE_CLIENT_ID" \
                  -e DevMode__BypassAuth="$BYPASS_AUTH" \
                  -e Ai__DeepSeekApiKey="$DEEPSEEK_API_KEY" "$ROLLBACK_IMAGE"
                podman run -d --pod encounter-pod --name encounter-daily-nginx \
                  -v /opt/encounter-daily/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
                  -v /opt/encounter-daily/ssl:/etc/nginx/ssl:ro \
                  -v /opt/encounter-daily/frontend/www:/opt/encounter-daily/frontend/www:ro \
                  docker.io/nginx:alpine
                echo "Rollback complete"
              else
                echo "No previous image. Production remains down."
              fi
              exit 1
            fi
            echo "API health check passed (HTTP $HTTP_CODE)"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
            echo "Frontend status: HTTP $HTTP_CODE"
            echo "Deployment verified successfully"

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run unit tests with coverage
        run: dotnet test backend/ --filter "Category=Unit" --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Run integration tests with coverage
        run: dotnet test backend/ --filter "Category=Integration" --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run unit tests
        run: cd frontend && npx jest --ci
      - name: Run linting
        run: cd frontend && npx ng lint


name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run unit tests
        run: dotnet test backend/ --filter "Category=Unit" --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Run integration tests
        run: dotnet test backend/ --filter "Category=Integration" --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run unit tests
        run: cd frontend && npx jest --ci
      - name: Run linting
        run: cd frontend && npx ng lint

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npm run e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-run${{ github.run_number }}
          path: frontend/playwright-report/

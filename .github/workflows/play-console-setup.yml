name: Play Console Setup
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Google Play API Access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          package = "com.dailyreading.app"
          sa = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=["https://www.googleapis.com/auth/androidpublisher"]
          )
          creds.refresh(Request())
          token = creds.token

          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package}/edits"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          r = requests.post(base, headers=headers, timeout=30)
          print("Create edit:", r.status_code, r.text)
          r.raise_for_status()
          edit_id = r.json()["id"]

          r = requests.get(f"{base}/{edit_id}/tracks/alpha", headers=headers, timeout=30)
          print("Get alpha:", r.status_code, r.text)
          r.raise_for_status()
          track = r.json()

          for rel in track.get("releases", []):
              rel["status"] = "completed"
              rel["countryTargeting"] = {
                  "includeRestOfWorld": True,
                  "countries": ["US", "CA", "GB", "AU", "IN", "DE", "FR", "JP", "BR", "MX"],
              }

          r = requests.put(f"{base}/{edit_id}/tracks/alpha", headers=headers, json=track, timeout=30)
          print("Update alpha:", r.status_code, r.text)
          r.raise_for_status()

          r = requests.post(f"{base}/{edit_id}:commit", headers=headers, timeout=30)
          print("Commit:", r.status_code, r.text)
          r.raise_for_status()
          print("=== Done! ===")
          PY

name: Play Console Setup
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Diagnose
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          package = "com.dailyreading.app"
          sa = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=["https://www.googleapis.com/auth/androidpublisher"]
          )
          creds.refresh(Request())
          token = creds.token
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package}/edits"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          r = requests.post(base, headers=headers, timeout=30)
          r.raise_for_status()
          edit_id = r.json()["id"]

          for tr in ["alpha", "production"]:
              r = requests.get(f"{base}/{edit_id}/countryAvailability/{tr}", headers=headers, timeout=30)
              print(f"countryAvailability/{tr}:", r.status_code)
              print(json.dumps(r.json(), indent=2))

          r = requests.get(f"{base}/{edit_id}/tracks", headers=headers, timeout=30)
          print("TRACKS:", r.status_code)
          print(json.dumps(r.json(), indent=2))
          print("=== Done! ===")
          PY

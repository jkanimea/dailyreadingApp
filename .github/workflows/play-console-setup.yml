name: Play Console Setup
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Setup Google Play API Access
        run: |
          # Get access token
          TOKEN=$(gcloud auth print-access-token)
          PACKAGE="com.dailyreading.app"
          
          # 1. Get the current edit (find the latest one)
          echo "=== Creating new edit ==="
          EDIT_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits")
          EDIT_ID=$(echo "$EDIT_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Edit ID: $EDIT_ID"

          # 2. Get current track state
          echo "=== Getting current alpha track ==="
          TRACK_RESP=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/tracks/alpha")
          echo "Current track: $TRACK_RESP"

          # 3. Update track with country targeting + completed status
          echo "=== Updating alpha track ==="
          # Read current track and modify it
          TRACK_DATA=$(echo "$TRACK_RESP" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for release in data.get('releases', []):
    release['status'] = 'completed'
    release['countryTargeting'] = {
        'includeRestOfWorld': True,
        'countries': ['US', 'CA', 'GB', 'AU', 'IN', 'DE', 'FR', 'JP', 'BR', 'MX']
    }
    release['userFraction'] = 1.0
print(json.dumps(data))
")
          echo "Updated track data: $TRACK_DATA"

          UPDATE_RESP=$(curl -s -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$TRACK_DATA" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/tracks/alpha")
          echo "Update response: $UPDATE_RESP"

          # 4. Commit the edit
          echo "=== Committing edit ==="
          COMMIT_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID:commit")
          echo "Commit response: $COMMIT_RESP"

          # Check for errors
          if echo "$COMMIT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',{}).get('message',''))" | grep -q .; then
            ERROR_MSG=$(echo "$COMMIT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',{}).get('message',''))")
            echo "ERROR: $ERROR_MSG"
            exit 1
          fi
          echo "=== Done! ==="

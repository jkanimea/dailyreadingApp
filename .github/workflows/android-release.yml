name: Android Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run unit tests
        run: dotnet test backend/ --filter "Category=Unit" --no-restore --verbosity normal

  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run integration tests
        run: dotnet test backend/ --filter "Category=Integration" --no-restore --verbosity normal

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run unit tests
        run: cd frontend && npx jest --ci
      - name: Run linting
        run: cd frontend && npx ng lint

  frontend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run integration tests
        run: cd frontend && npx jest --ci --passWithNoTests

  e2e-tests:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npm run e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-run${{ github.run_number }}
          path: frontend/playwright-report/

  build:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Android builder image
        run: docker build -t android-builder -f deploy/android/Containerfile .

      - name: Write keystore
        run: |
          printf '%s\n' "${{ secrets.KEYSTORE }}" | tr -d '[:space:]' | base64 -d > /tmp/encounter-daily-keystore.jks
          test -s /tmp/encounter-daily-keystore.jks || { echo "ERROR: Keystore decode produced empty file"; exit 1; }
          echo "Keystore written: $(wc -c < /tmp/encounter-daily-keystore.jks) bytes"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p apk-output
          docker run --rm \
            -v ${{ github.workspace }}/frontend:/app/frontend \
            -v ${{ github.workspace }}/assets:/app/assets \
            -v ${{ github.workspace }}/apk-output:/output \
            -v /tmp/encounter-daily-keystore.jks:/tmp/encounter-daily-keystore.jks:ro \
            -e API_URL=https://mg-encounter.com/api/v1 \
            -e KEYSTORE_PATH=/tmp/encounter-daily-keystore.jks \
            -e KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -e KEY_PASSWORD="$KEY_PASSWORD" \
            -e GOOGLE_SERVICES_JSON="$GOOGLE_SERVICES_JSON" \
            -e VERSION=$(git rev-list --count HEAD) \
            android-builder

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.ref_name }}-run${{ github.run_number }}
          path: apk-output/app-release.apk

      - name: Tag release with next version number
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          LATEST=$(git tag --list 'v1.0.*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.1"
          else
            NUM=$(echo "$LATEST" | sed 's/^v1\.0\.//')
            NEXT="v1.0.$((NUM + 1))"
          fi
          git tag "$NEXT"
          git push origin "$NEXT"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: apk-output/app-release.apk
          generate_release_notes: true

      - name: Print download URL
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "APK released!"
          echo "Download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"

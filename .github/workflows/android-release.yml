name: Android Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run unit tests
        run: dotnet test backend/ --filter "Category=Unit" --no-restore --verbosity normal

  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/
      - name: Run integration tests
        run: dotnet test backend/ --filter "Category=Integration" --no-restore --verbosity normal

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run unit tests
        run: cd frontend && npx jest --ci --no-coverage --testPathPattern="src/app/core/"
      - name: Run linting
        run: cd frontend && npx ng lint

  frontend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run integration tests
        run: cd frontend && npx jest --ci --no-coverage --testPathPattern="src/app/features/"

  e2e-tests:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd frontend && npm run e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-run${{ github.run_number }}
          path: frontend/playwright-report/

  build:
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests, frontend-integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Android builder image
        run: docker build -t android-builder -f deploy/android/Containerfile .

      - name: Write keystore
        run: |
          printf '%s\n' "${{ secrets.KEYSTORE }}" | tr -d '[:space:]' | base64 -d > /tmp/encounter-daily-keystore.jks
          test -s /tmp/encounter-daily-keystore.jks || { echo "ERROR: Keystore decode produced empty file"; exit 1; }
          echo "Keystore written: $(wc -c < /tmp/encounter-daily-keystore.jks) bytes"

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          mkdir -p apk-output
          docker run --rm \
            -v ${{ github.workspace }}/frontend:/app/frontend \
            -v ${{ github.workspace }}/assets:/app/assets \
            -v ${{ github.workspace }}/apk-output:/output \
            -v /tmp/encounter-daily-keystore.jks:/tmp/encounter-daily-keystore.jks:ro \
            -e API_URL=https://mg-encounter.com/api/v1 \
            -e KEYSTORE_PATH=/tmp/encounter-daily-keystore.jks \
            -e KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -e KEY_PASSWORD="$KEY_PASSWORD" \
            -e GOOGLE_SERVICES_JSON="$GOOGLE_SERVICES_JSON" \
          -e FACEBOOK_CLIENT_TOKEN="$FACEBOOK_CLIENT_TOKEN" \
            -e VERSION=$(echo "300000 + $(git rev-list --count HEAD)" | bc) \
            android-builder

      - name: Upload APK + AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ github.ref_name }}-run${{ github.run_number }}
          path: apk-output/

      - name: Upload to Play Store (closed testing - track1)
        id: upload-play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dailyreading.app
          releaseFiles: apk-output/app-release.aab
          tracks: track1
          status: completed
          releaseName: Release ${{ github.ref_name }}

      - name: Tag release with next version number
        id: tag_version
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git fetch --tags origin
          LATEST=$(git tag --list 'v1.0.*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.1"
          else
            NUM=$(echo "$LATEST" | sed 's/^v1\.0\.//')
            NEXT="v1.0.$((NUM + 1))"
          fi
          while git rev-parse "$NEXT" >/dev/null 2>&1; do
            NUM=$((NUM + 1))
            NEXT="v1.0.$NUM"
          done
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "tag_name=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: |
            apk-output/app-release.apk
            apk-output/app-release.aab
          generate_release_notes: true

      - name: Print download URL
        run: |
          TAG="${{ steps.tag_version.outputs.tag_name }}"
          if [ -n "$TAG" ]; then
            echo "Tag $TAG created!"
            echo "Artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Release (pending tag build): https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk"
          elif [[ '${{ github.ref_type }}' == 'tag' ]]; then
            echo "APK + AAB released and uploaded to Play Store (internal)!"
            echo "Download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.aab"
          else
            echo "APK + AAB artifacts uploaded!"
            echo "Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  device-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          pattern: android-build-*

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window
          script: |
            chmod +x frontend/scripts/android-smoke-test.sh
            frontend/scripts/android-smoke-test.sh "$(find . -name 'app-release.apk' | head -1)" emulator-5554

  deploy-production:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - name: Authenticate with GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy to production VPS
        env:
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          JWT_RSA_PRIVATE_KEY: ${{ secrets.JWT_RSA_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

          for ps1 in database/encounter/convert-*.ps1; do pwsh "$ps1" || true; done
          for ps1 in deploy/scripts/convert-*.ps1; do pwsh "$ps1" || true; done

          ./deploy/deploy.sh production

  android-apk:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Android builder image
        run: docker build -t android-builder -f deploy/android/Containerfile .
      - name: Write keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | grep -v '^---' | base64 -d > /tmp/encounter-daily-keystore.jks
      - name: Build signed APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/frontend:/app/frontend:ro \
            -v /tmp/encounter-daily-keystore.jks:/tmp/encounter-daily-keystore.jks:ro \
            -v ${{ github.workspace }}/apk-output:/output \
            -e API_URL=https://mg-encounter.com/api/v1 \
            -e KEYSTORE_PATH=/tmp/encounter-daily-keystore.jks \
            -e KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -e KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            android-builder
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: apk-output/

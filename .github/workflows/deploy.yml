  deploy-production:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    steps:
      - uses: actions/checkout@v6

      - name: Build and push API image
        run: |
          docker build -t ghcr.io/jkanimea/encounter-daily-api:production-latest -f backend/Containerfile backend
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/jkanimea/encounter-daily-api:production-latest

      - name: Sync deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*"
          target: "/opt/encounter-daily"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/encounter-daily

            # Clean up old build artifacts that could interfere
            rm -rf android 2>/dev/null || true

            cat > .env <<'ENVEOF'
            SA_PASSWORD=${{ secrets.SA_PASSWORD }}
            JWT_RSA_PRIVATE_KEY=${{ secrets.JWT_RSA_PRIVATE_KEY }}
            ASPNETCORE_ENVIRONMENT=Production
            BYPASS_AUTH=true
            API_IMAGE_TAG=production-latest
            ENVEOF

            podman rm -f encounter-daily-sql encounter-daily-api encounter-daily-nginx 2>/dev/null || true
            podman pull ghcr.io/jkanimea/encounter-daily-api:production-latest
            podman-compose -f podman-compose.yml up -d --no-build

            sleep 5
            curl -sf http://localhost:5000/api/v1/reading/series/1/today > /dev/null && echo "API healthy" || echo "Warning: API health check failed"


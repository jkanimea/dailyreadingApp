  deploy-production:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output-${{ github.ref_name }}-run${{ github.run_number }}
          path: .

      - name: Copy seed data to build context
        run: cp -r database/seed-data backend/seed-data

      - name: Build and push API image
        run: |
          docker build -t ghcr.io/jkanimea/encounter-daily-api:production-latest -f backend/Containerfile backend
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jkanimea/encounter-daily-api:production-latest

      - name: Sync files to VPS
        run: |
          echo "${{ secrets.SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: syncing deploy files..."
            rsync -avz --timeout=300 -e "ssh $SSH_OPTS" \
              deploy/ ${{ vars.SSH_USER }}@${{ vars.PRODUCTION_HOST }}:/opt/encounter-daily/deploy/ && \
            echo "Attempt $attempt: syncing frontend..." && \
            rsync -avz --timeout=300 -e "ssh $SSH_OPTS" \
              frontend/www/ ${{ vars.SSH_USER }}@${{ vars.PRODUCTION_HOST }}:/opt/encounter-daily/frontend/www/ && \
            echo "Sync successful." && exit 0
            echo "Attempt $attempt failed. Retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed — check VPS connectivity."
          exit 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/encounter-daily

            # Clean up old build artifacts that could interfere
            rm -rf android 2>/dev/null || true

            cat > .env <<'ENVEOF'
            SA_PASSWORD="${{ secrets.SA_PASSWORD }}"
            JWT_RSA_PRIVATE_KEY="${{ secrets.JWT_RSA_PRIVATE_KEY }}"
            ASPNETCORE_ENVIRONMENT=Production
            BYPASS_AUTH=false
            JWT__GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            OAUTH__GOOGLE__CLIENTID="${{ secrets.GOOGLE_CLIENT_ID }}"
            OAUTH__FACEBOOK__APPID="${{ secrets.FACEBOOK_APP_ID }}"
            OAUTH__FACEBOOK__APPSECRET="${{ secrets.FACEBOOK_APP_SECRET }}"
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
            API_IMAGE_TAG=production-latest
            ENVEOF

            # Remove old pod/containers (both root and jkanimea), pull latest image
            sudo podman pod rm -f encounter-pod 2>/dev/null || true
            sleep 2
            podman pod rm -f encounter-pod 2>/dev/null || true
            podman pull ghcr.io/jkanimea/encounter-daily-api:production-latest

            # Source .env so we can reference env vars directly
            set -a; source .env; set +a

            # Create pod (shared network namespace — all containers use localhost)
            podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000 \
              || { echo "Pod create failed — ports may be held by root. Retrying after sudo cleanup...";
                   sudo podman pod rm -f encounter-pod 2>/dev/null || true;
                   sleep 2;
                   podman pod create --name encounter-pod -p 80:80 -p 443:443 -p 5000:5000 \
                     || { echo "FATAL: Could not create pod."; exit 1; }; }

            # Start SQL
            podman run -d --pod encounter-pod --name encounter-daily-sql \
              -e ACCEPT_EULA=Y \
              -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
              -e MSSQL_PID=Express \
              -v sql-data:/var/opt/mssql \
              mcr.microsoft.com/mssql/server:2022-latest

            # Wait for SQL to be healthy
            echo "Waiting for SQL Server..."
            for i in $(seq 1 30); do
              podman exec encounter-daily-sql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
              sleep 2
            done

            # Start API
            podman run -d --pod encounter-pod --name encounter-daily-api \
              -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
              -e ASPNETCORE_URLS=http://+:5000 \
              -e ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=EncounterDaily;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;" \
              -e Jwt__RsaPrivateKey="$JWT_RSA_PRIVATE_KEY" \
              -e Jwt__GoogleClientId="$JWT__GOOGLE_CLIENT_ID" \
              -e DevMode__BypassAuth="$BYPASS_AUTH" \
              -e Ai__DeepSeekApiKey="${{ secrets.DEEPSEEK_API_KEY }}" \
              ghcr.io/jkanimea/encounter-daily-api:production-latest

            # Start nginx
            podman run -d --pod encounter-pod --name encounter-daily-nginx \
              -v /opt/encounter-daily/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /opt/encounter-daily/ssl:/etc/nginx/ssl:ro \
              -v /opt/encounter-daily/frontend/www:/opt/encounter-daily/frontend/www:ro \
              docker.io/nginx:alpine

            # Health check
            sleep 5
            curl -sf http://localhost:5000/api/v1/reading/series/1/today > /dev/null \
              && echo "API healthy" || echo "Warning: API health check failed"

  android-apk:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Android builder image
        run: docker build -t android-builder -f deploy/android/Containerfile .
      - name: Write keystore
        run: |
          printf '%s\n' "${{ secrets.KEYSTORE }}" | tr -d '[:space:]' | base64 -d > /tmp/encounter-daily-keystore.jks
          test -s /tmp/encounter-daily-keystore.jks || { echo "ERROR: Keystore decode produced empty file — check the KEYSTORE secret is valid base64"; exit 1; }
          echo "Keystore written: $(wc -c < /tmp/encounter-daily-keystore.jks) bytes"
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          docker run --rm \
            -v ${{ github.workspace }}/frontend:/app/frontend \
            -v /tmp/encounter-daily-keystore.jks:/tmp/encounter-daily-keystore.jks:ro \
            -v ${{ github.workspace }}/apk-output:/output \
            -e API_URL=https://mg-encounter.com/api/v1 \
            -e KEYSTORE_PATH=/tmp/encounter-daily-keystore.jks \
            -e KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -e KEY_PASSWORD="$KEY_PASSWORD" \
            -e GOOGLE_SERVICES_JSON="$GOOGLE_SERVICES_JSON" \
            android-builder
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-run${{ github.run_number }}
          path: apk-output/

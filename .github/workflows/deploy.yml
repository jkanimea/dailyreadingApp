name: Deploy Pipeline

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.x

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Run backend tests
        run: dotnet test backend/ --filter "Category=Unit"
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm test -- --no-coverage

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Build .NET API
        run: dotnet publish backend/EncounterDaily.API/EncounterDaily.API.csproj -c Release -o publish/api
      - name: Build Angular app
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build -- --configuration production
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.ref_name }}-run${{ github.run_number }}
          path: |
            publish/
            frontend/www/


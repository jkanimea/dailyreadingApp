name: Auto-Review Loop (Greploop)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop, main]

jobs:
  greploop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Install and run Greploop
        run: |
          npx skills add https://github.com/greptileai/skills-greploop
          greploop --pr ${{ github.event.pull_request.number }}

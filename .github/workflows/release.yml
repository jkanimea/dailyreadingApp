name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web app
        run: npm run build
        working-directory: frontend

      - name: Add Android platform
        run: npx cap add android
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Generate Android icons
        run: node scripts/copy-android-icon.mjs
        working-directory: frontend
        env:
          NODE_DEBUG: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - uses: softprops/action-gh-release@v2
        id: create_release
        with:
          name: Release ${{ github.ref_name }}
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      - name: Print download URL
        run: |
          echo "✅ APK ready!"
          echo "📱 Download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk"
          echo "📦 Release page: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
